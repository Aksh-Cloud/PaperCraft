<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — PaperCraft Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

<div class="bg-grid"></div>
<div class="bg-fog"></div>
<div class="particles" id="particles"></div>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <div class="logo-cube">
                    <div class="cube-face front"></div>
                    <div class="cube-face top"></div>
                    <div class="cube-face side"></div>
                </div>
            </div>
            <span class="logo-text">PaperCraft</span>
            <span class="logo-tag">ACCOUNT</span>
        </a>
        <nav class="site-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="login.html" class="nav-link active">Sign In</a>
            <a href="signup.html" class="nav-link">Sign Up</a>
        </nav>
    </div>
</header>

<main class="auth-main">
    <div class="auth-split">

        <!-- Left Panel: Decorative -->
        <div class="auth-deco">
            <div class="deco-title">Welcome<br>Back.</div>
            <p class="deco-sub">Sign in to access your worlds, skin and multiplayer profile.</p>
            <div class="deco-blocks">
                <div class="db db1"></div>
                <div class="db db2"></div>
                <div class="db db3"></div>
                <div class="db db4"></div>
                <div class="db db5"></div>
                <div class="db db6"></div>
            </div>
            <div class="deco-player">
                <div class="dp-head"></div>
                <div class="dp-body"></div>
                <div class="dp-arm left"></div>
                <div class="dp-arm right"></div>
                <div class="dp-leg left"></div>
                <div class="dp-leg right"></div>
            </div>
        </div>

        <!-- Right Panel: Form -->
        <div class="auth-form-wrap">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h1>Sign In</h1>
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>

                <form class="auth-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <rect x="1" y="3" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
                                <path d="M1 5l7 5 7-5" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="steve@example.com" autocomplete="email" required />
                        </div>
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <rect x="2" y="7" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
                                <path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                                <circle cx="8" cy="11" r="1.5" fill="currentColor"/>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                <svg class="eye-open" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
                                <svg class="eye-closed" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M2 2l12 12M6.5 6.7A3 3 0 0011.3 11" stroke="currentColor" stroke-width="1.2"/><path d="M1 8s1-2.5 4-4m6-.5c2 1 3.5 4.5 3.5 4.5" stroke="currentColor" stroke-width="1.2"/></svg>
                            </button>
                        </div>
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <div class="form-extras">
                        <label class="checkbox-wrap">
                            <input type="checkbox" id="remember" name="remember" />
                            <span class="custom-check"></span>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <div class="form-error" id="formError"></div>

                    <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" hidden>
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                            <span class="loader-dot"></span>
                        </span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <div class="auth-alt">
                    <p>Continue as guest to play without an account:</p>
                    <a href="../game.html" class="btn btn-ghost btn-full">Play as Guest</a>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
